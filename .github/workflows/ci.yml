name: CI

on:
  push:
    # Work branches too: the only compiler for this project is the macOS runner, and a
    # branch that was pushed unchecked is how `main` ended up red for four commits.
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The release builds use the current Xcode — App Store uploads require the current SDK —
      # and the runner's default is a year behind. Two compilers disagree about Swift 6
      # concurrency: the watch fix for build 16 compiled locally and failed here. CI checks
      # with the compiler that ships.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | python3 -c 'import re, sys
          paths = [l.strip() for l in sys.stdin if re.search(r"Xcode_[0-9.]+\.app$", l.strip())]
          print(max(paths, key=lambda p: [int(n) for n in re.findall(r"[0-9]+", p.split("Xcode_")[1])]))')
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test the core package
        run: |
          set -o pipefail
          swift test 2>&1 | tee "${RUNNER_TEMP}/swift-test.log"

      # The column order in frames.csv and the key names in scene.json are a contract
      # between Swift and Python that neither compiler can see. The Blender importer's own
      # parsing is the only thing that can check it, and until now it only ran when
      # somebody remembered to run it by hand.
      - name: Check the Blender bundle contract
        if: ${{ !cancelled() }}
        run: |
          SS_BUNDLE_OUT="${RUNNER_TEMP}/ss-bundle" swift test --filter bundleContents
          python3 Tools/blender/check_bundle.py "${RUNNER_TEMP}/ss-bundle"

      # Every size and every pose. The audit is the cheap half of that promise: it cannot
      # see a layout, but it catches the constructs that make one impossible — a screen
      # measured instead of a container, a bar that cannot move to the side, a fixed width.
      - name: Audit the adaptive layout
        if: ${{ !cancelled() }}
        run: python3 Tools/adaptive_audit.py

      # Arabic ships. Hard-coded left and right survive a German build untouched.
      - name: Audit for right-to-left
        if: ${{ !cancelled() }}
        run: python3 Tools/rtl_audit.py

      - name: The localisation locks
        if: ${{ !cancelled() }}
        run: python3 Tools/l10n.py verify

      # Die Lücke vor dem Katalogabgleich: ein deutscher Text, den der Compiler gar
      # nicht erst als übersetzbar erkennt. Sechs davon standen in 26 Sprachen auf
      # Deutsch, einer auf dem Hauptbildschirm.
      - name: No German text the compiler never sees
        if: ${{ !cancelled() }}
        run: python3 Tools/l10n_literals.py

      - name: Generate the Xcode project
        if: ${{ !cancelled() }}
        run: xcodegen generate

      # Signing and upload stay local: the CI certificate's private key is not in
      # the repo and must not be.
      - name: Build the app
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -quiet -project Sensorstorm.xcodeproj -scheme Sensorstorm \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "${RUNNER_TEMP}/xcodebuild.log"

      # Ein `LocalizedStringKey`, den niemand in den Katalog getragen hat, fällt in
      # jeder Sprache auf Deutsch zurück — und `l10n.py doctor` sieht ihn nie, weil
      # der nur zählt, was schon drinsteht. Genau so standen 61 Texte in 26 Sprachen
      # auf Deutsch, bis eines davon in einem arabischen Store-Screenshot auffiel.
      - name: Every localisable text is in the catalog
        if: ${{ !cancelled() }}
        run: DERIVED_DATA=.derived-data python3 Tools/l10n_extract.py

      # Die Fehlerzeilen allein, am Ende des Protokolls: ein roter Lauf soll in einem Blick
      # sagen, was kaputt ist, statt in zweihundert Zeilen „bestanden" zu versinken.
      - name: What failed
        if: failure()
        run: |
          for name in swift-test xcodebuild; do
            file="${RUNNER_TEMP}/${name}.log"
            if [ -f "$file" ]; then
              echo "== ${name}"
              grep -E "recorded an issue|error:" "$file" | sort -u | head -60 || true
            fi
          done
          true
