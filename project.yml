name: Sensorstorm
options:
  bundleIdPrefix: ch.sensorstorm
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SensorstormCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "E3CQ6W7CY2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Sensorstorm:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        excludes:
          - Info.plist
          # Test data for the simulator, wired into the Run action below. Shipping it
          # inside the app would be dead weight in every download.
          - Sensorstorm.storekit
    dependencies:
      - package: SensorstormCore
      # Embedded so the watch app installs with the phone app — and so CI builds it. A
      # companion target nothing depends on is a target nobody notices breaking.
      - target: SensorstormWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.sensorstorm.app
        PRODUCT_NAME: Sensorstorm
        INFOPLIST_KEY_CFBundleDisplayName: Sensorstorm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Sensorstorm
        # Every language the String Catalog actually carries. Declaring one that is
        # not translated is the mistake this app already made once, for eight builds.
        CFBundleLocalizations:
          - de
          - en
          - fr
          - it
          - es
          - nl
          - pt-BR
          - ja
          - ko
          - zh-Hant
          - pt-PT
          - zh-Hans
          - ru
          - ar
          - da
          - sv
          - nb
          - fi
          - pl
          - cs
          - sk
          - uk
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Sensor logging has to survive the screen locking mid-measurement.
        UIBackgroundModes:
          - location
          - audio
        # Recordings are meant to leave the phone — Files.app access is part of the product.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMotionUsageDescription: >-
          Sensorstorm zeichnet Beschleunigung, Drehrate, Orientierung, Magnetfeld und
          Schritte auf.
        NSLocationWhenInUseUsageDescription: >-
          Sensorstorm zeichnet Position, Höhe, Geschwindigkeit und Kurs auf, richtet die
          Orientierungsdaten an Nord aus und hält fest, wo eine Beobachtung erfasst
          wurde.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Sensorstorm zeichnet die Position auch dann weiter auf, wenn der Bildschirm
          während einer Messung gesperrt wird.
        NSMicrophoneUsageDescription: >-
          Sensorstorm misst die Lautstärke, nimmt auf Wunsch Ton zur Messung auf und
          zeichnet den Ton der kurzen Clips zu einer Beobachtung auf.
        NSCameraUsageDescription: >-
          Sensorstorm nimmt Video synchron zu den Sensordaten auf und fotografiert den Boden
          für eine Beobachtung.
        # Only when the Bluetooth stream is armed: the central is constructed on start, not
        # on launch, so nobody is asked for a sensor they never switched on.
        NSBluetoothAlwaysUsageDescription: >-
          Sensorstorm zählt, wie viele Bluetooth-Geräte in der Umgebung senden, und
          zeichnet die Signalstärke auf. Es wird keine Verbindung zu ihnen aufgebaut.
        NSLocalNetworkUsageDescription: >-
          Sensorstorm sendet die Messwerte an die Adresse, die du in den Einstellungen
          einträgst. Liegt der Server im selben Netz, braucht das diese Freigabe.
        # The endpoint is whatever the user typed, and a self-hosted receiver on the LAN is
        # the normal case: a Raspberry Pi, a Node-RED box, Home Assistant. Those speak plain
        # HTTP and cannot present a certificate any CA would sign. The exception is scoped
        # to local hostnames — everything on the public internet still has to be HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # The watch half: heart rate and wrist motion, sent over to the phone.
  #
  # Deliberately without the SensorstormCore dependency. The watch needs two sensor names
  # and a wire format, not a storage engine, a geodesy library and eight exporters — and
  # keeping the package off watchOS keeps its platform list honest.
  SensorstormWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
        excludes:
          - Info.plist
          - Sensorstorm.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.sensorstorm.app.watchkitapp
        PRODUCT_NAME: Sensorstorm
        # 4 = Apple Watch. The phone app is "1,2"; this one runs nowhere else.
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Watch/Sensorstorm.entitlements
        # Without an icon set here altool refuses the whole upload: the watch bundle
        # has no CFBundleIconName and no icon files (90713, 90391), and that rejects
        # the iPhone app along with it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Sensorstorm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Single-target watch app, the shape Xcode has produced since watchOS 7.
        WKApplication: true
        WKCompanionAppBundleIdentifier: ch.sensorstorm.app
        WKRunsIndependentlyOfCompanionApp: false
        CFBundleLocalizations:
          - de
          - en
          - fr
          - it
          - es
          - nl
          - pt-BR
          - ja
          - ko
          - zh-Hant
          - pt-PT
          - zh-Hans
          - ru
          - ar
          - da
          - sv
          - nb
          - fi
          - pl
          - cs
          - sk
          - uk
        NSHealthShareUsageDescription: >-
          Sensorstorm liest während einer Aufnahme deine Herzfrequenz, um sie zusammen mit
          den übrigen Sensordaten aufzuzeichnen. Es wird nichts in „Health" geschrieben.
        NSMotionUsageDescription: >-
          Sensorstorm zeichnet die Bewegung deines Handgelenks auf und überträgt sie an das
          iPhone.
        # Required whenever the HealthKit entitlement is present, even for an app that only
        # reads: without it App Store Connect fails the upload with 90683 after altool has
        # already reported success, and the build never appears in TestFlight.
        NSHealthUpdateUsageDescription: >-
          Sensorstorm schreibt nichts in „Health". Die Herzfrequenz wird nur gelesen und
          zusammen mit den übrigen Sensordaten in der Aufnahme abgelegt.

# Explicit so the StoreKit configuration below travels with the repo. Without it the
# in-app purchase can only be exercised against App Store Connect, which means a signed
# build on real hardware for every change to the paywall.
#
# The configuration is bound to the Run action only: `archive` and `test` never see it, so
# a build headed for TestFlight talks to the real App Store.
schemes:
  Sensorstorm:
    build:
      targets:
        Sensorstorm: all
    run:
      config: Debug
      storeKitConfiguration: Resources/Sensorstorm.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
